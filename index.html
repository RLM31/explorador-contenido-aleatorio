<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorador de contenido aleatorio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">Explorador de contenido aleatorio</h1>

    <div class="row g-4">
      <div class="col-12 col-md-6">
        <div class="card h-100 shadow-sm">
          <div class="card-header fw-bold">Citas</div>
          <div class="card-body">
            <p id="estado-cita" class="estado text-muted"></p>
            <blockquote id="contenido-cita" class="mb-0"></blockquote>
          </div>
          <div class="card-footer">
            <button id="boton-cita" class="btn btn-primary w-100">Obtener otra cita</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="card h-100 shadow-sm">
          <div class="card-header fw-bold">Perros</div>
          <div class="card-body">
            <p id="estado-perro" class="estado text-muted"></p>
            <div class="contenedor-imagen">
              <img id="imagen-perro" alt="Imagen aleatoria de un perro" hidden>
            </div>
          </div>
          <div class="card-footer">
            <button id="boton-perro" class="btn btn-primary w-100">Mostrar otro perro</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="card h-100 shadow-sm">
          <div class="card-header fw-bold">Gatos</div>
          <div class="card-body">
            <p id="estado-gato" class="estado text-muted"></p>
            <div class="contenedor-imagen">
              <img id="imagen-gato" alt="Imagen aleatoria de un gato" hidden>
            </div>
          </div>
          <div class="card-footer">
            <button id="boton-gato" class="btn btn-primary w-100">Mostrar otro gato</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="card h-100 shadow-sm">
          <div class="card-header fw-bold">Datos curiosos</div>
          <div class="card-body">
            <p id="estado-dato" class="estado text-muted"></p>
            <p id="contenido-dato" class="mb-0"></p>
          </div>
          <div class="card-footer">
            <button id="boton-dato" class="btn btn-primary w-100">Mostrar otro dato</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
